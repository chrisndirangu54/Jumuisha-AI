name: Flutter checks
on:
  push:
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          cd mobile
          flutter create --platforms=android,web . --project-name jumuisha_ai
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --dart-define=API_BASE_URL=https://example.invalid
